# Actions タブの「Run workflow」から、環境と GitHub ユーザー名を入力して管理者にする。
# ユーザー名を GitHub API で数値 ID に変換し、稼働中のコンテナで `bin/rails admin:grant[uid]` を実行する（lib/tasks/admin.rake）。
# 対象ユーザーは先に一度その環境にログインしている必要がある。
name: Grant admin

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 対象の環境
        type: choice
        options: [staging, production]
        default: staging
        required: true
      login:
        description: 管理者にする人の GitHub ユーザー名
        type: string
        required: true

jobs:
  grant:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.destination }}
    permissions:
      contents: read
    env:
      DESTINATION: ${{ inputs.destination }}
      LOGIN: ${{ inputs.login }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Ruby と Kamal を用意する
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: サーバーへの接続を用意する
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: .github/scripts/prepare_ssh

      # 稼働中のコンテナを再利用する（--reuse）ので環境変数の注入は不要だが、
      # Kamal が設定を読む際に secrets-common の config/master.key を参照するため用意する
      - name: Kamal の設定を用意する
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/write_kamal_secrets "$DESTINATION"

      # users.name（GitHub のユーザー名）は改名・解放・再取得ができるため、アプリ側では変わらない数値 ID
      # （users.uid）で照合する。ユーザー名から ID への変換はここで GitHub API を使って行う
      - name: GitHub ユーザー名を数値 ID に変換する
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub ユーザー名は英数字とハイフンだけなので、引用符や空白を含む入力はここで弾く
        run: |
          if ! printf '%s' "$LOGIN" | grep -Eq '^[A-Za-z0-9-]+$'; then
            echo "GitHub ユーザー名として不正です: $LOGIN" >&2
            exit 1
          fi
          uid="$(gh api "users/$LOGIN" --jq .id)"
          if ! printf '%s' "$uid" | grep -Eq '^[0-9]+$'; then
            echo "GitHub ユーザー「$LOGIN」の ID を取得できませんでした" >&2
            exit 1
          fi
          echo "$LOGIN の GitHub ID は $uid"
          echo "uid=$uid" >> "$GITHUB_OUTPUT"

      - name: 管理者にする
        env:
          UID_TO_GRANT: ${{ steps.resolve.outputs.uid }}
        run: bin/kamal app exec -d "$DESTINATION" --reuse "bin/rails \"admin:grant[$UID_TO_GRANT]\""
