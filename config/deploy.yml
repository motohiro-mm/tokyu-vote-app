# Kamal の共通設定。環境ごとに異なるもの（service・servers・proxy・volumes・環境変数）は
# config/deploy.staging.yml / config/deploy.production.yml に置き、`bin/kamal deploy -d <環境>` で選ぶ。
# 秘密情報は .kamal/secrets-common（共通）と .kamal/secrets.<環境>（git 管理外）から注入する。

# コンテナイメージ名。両環境で共通（タグで区別される）
image: motohiro-mm/tokyu-vote-app

# イメージの置き場。リポジトリが GitHub にあるので GitHub Container Registry を使う
registry:
  server: ghcr.io
  username: motohiro-mm
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# 新旧バージョンのアセットを同居させ、デプロイ直後の 404 を防ぐ
asset_path: /rails/public/assets

builder:
  arch: amd64
