---
# ERB のスタイルチェック。既定のリンター一式を有効にする。
# https://github.com/Shopify/erb_lint
EnableDefaultLinters: true

linters:
  # ERB 内の式が HTML コンテキストとして安全か検査する（XSS 対策）
  ErbSafety:
    enabled: true
  # ERB 内の Ruby コードを RuboCop で検査する
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_gem:
        rubocop-rails-omakase: rubocop.yml
      # ERB の断片を単独のRubyファイルとして見るため、
      # ファイル全体を前提にするルールは無効化する
      Layout/InitialIndentation:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
